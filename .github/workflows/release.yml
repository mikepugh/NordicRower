name: Release NordicRower

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Read version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NORDICROWER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NORDICROWER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NORDICROWER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NORDICROWER_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Signing configuration is pending. Source checks will run; a maintainer must publish locally signed assets.'
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nordicrower.keystore"
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - name: Prepare USB dependency
        run: bash setup-vendor.sh
      - name: Check release source
        run: ./gradlew -PVERSION_NAME="${{ steps.version.outputs.version }}" :app:testDebugUnitTest :app:lintRelease
      - name: Build signed release
        if: steps.signing.outputs.configured == 'true'
        env:
          NORDICROWER_KEYSTORE_PATH: ${{ runner.temp }}/nordicrower.keystore
          NORDICROWER_KEYSTORE_PASSWORD: ${{ secrets.NORDICROWER_KEYSTORE_PASSWORD }}
          NORDICROWER_KEY_ALIAS: ${{ secrets.NORDICROWER_KEY_ALIAS }}
          NORDICROWER_KEY_PASSWORD: ${{ secrets.NORDICROWER_KEY_PASSWORD }}
        run: ./gradlew -PVERSION_NAME="${{ steps.version.outputs.version }}" :app:assembleRelease
      - name: Verify and package
        if: steps.signing.outputs.configured == 'true'
        run: python3 package-release.py --version "${{ steps.version.outputs.version }}"
      - name: Publish release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: NordicRower ${{ steps.version.outputs.version }}
          body_path: docs/release-notes.md
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            build/release/NordicRower.apk
            build/release/NordicRower-${{ steps.version.outputs.version }}.zip
            build/release/SHA256SUMS.txt
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nordicrower.keystore"
